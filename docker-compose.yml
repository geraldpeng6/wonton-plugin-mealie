# Mealie 菜谱库：网页经核心网关登录（OIDC 自动跳转，打开就是主人的管理员账号），
# 从网址抓取菜谱要出网，SQLite 和图片存在插件数据目录里，不需要额外的数据库服务。
services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.30.0@sha256:90f83da6f3ab0a421efc827118a556168573930105f13fa3321768f42163d784
    # 官方入口先以 root 按 PUID/PGID 改建 abc 用户、chown /app 再降权运行（docker/entry.sh）；
    # 服务不写 user，核心把数据目录交给 PUID:PGID，正好衔接。JWT 和会话的 SECRET/SESSION_SECRET
    # 由 Mealie 首次启动生成、写进数据目录，升级保留，不用插件密钥。
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      # Mealie 用它生成 OIDC 回转地址和分享链接，写网关后面的公开地址。
      BASE_URL: ${WONTON_APP_URL}
      # 身份只从 OIDC 来，不开放应用自己的注册。
      ALLOW_SIGNUP: "false"
      OIDC_AUTH_ENABLED: "true"
      # 打开网页直接进身份提供方，不看 Mealie 的登录页；加 ?direct=1 还能回登录页。
      OIDC_AUTO_REDIRECT: "true"
      OIDC_CONFIGURATION_URL: ${WONTON_OIDC_ISSUER}/.well-known/openid-configuration
      OIDC_CLIENT_ID: ${WONTON_OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${WONTON_OIDC_CLIENT_SECRET}
      # 按用户名认人（云吞注入的用户名就是 OIDC 的 sub 和 preferred_username），邮箱会变，不按它认。
      OIDC_USER_CLAIM: preferred_username
      # 注入的 groups 声明是 ["owner"]，主人进 Mealie 就是管理员。
      OIDC_ADMIN_GROUP: owner
      # Mealie 把 email 列成 OIDC 的必需声明（v3.30.0 mealie/core/security/providers/openid_provider.py
      # 的 required_claims），主人没配邮箱要到第一次登录才失败；这里引用注入的邮箱，让安装先失败并写明原因。
      WONTON_OWNER_EMAIL: ${WONTON_OWNER_EMAIL:?用户还没配邮箱：Mealie 登录需要邮箱声明，先在云吞的资料里配好邮箱再装}
    volumes:
      - ${WONTON_APP_DATA}/data:/app/data
    healthcheck:
      # 上游镜像自带的检查脚本：/api/app/about 由后端真正答出来才算过（镜像里有 curl）。
      test: ["CMD", "/app/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      start_interval: 1s

x-wonton:
  spec: "0.4"
  id: io.mealie.mealie
  version: 0.1.0
  kind: app
  title: { zh: 家庭菜谱（Mealie）, en: Recipe Book (Mealie) }
  description:
    zh: 像自家的下厨房：网上看到的好菜谱贴个网址就存进来，排好一周菜单，一键生成买菜清单。
    en: "Your family recipe book: save a recipe from any website by pasting its link, plan the week's meals, and turn the plan into a shopping list in one tap."
  icon: icon.png
  notices: [NOTICE]
  screenshots: [screenshots/home.png]
  author: { name: geraldpeng6 }
  homepage: https://docs.mealie.io
  # Mealie 是 AGPL-3.0；插件包自己的许可证在 LICENSE（MIT）。
  license: AGPL-3.0-only
  tags:
    zh: [菜谱]
    en: [Recipes]
  about:
    zh: |
      从网址导入菜谱，也可以手动建；食材、步骤、标签和图片都存在自己家里。按食材或标签找菜，排一周的菜单，
      一键把菜单变成购物清单。

      打开就用，不用再登录一次；云吞里的身份进来就是管理员。从网址导入要出网。
    en: |
      Import recipes from a URL or write your own; ingredients, steps, tags and photos stay at home. Search by
      ingredient or tag, plan the week's menu and turn it into a shopping list.

      Opening the page is enough, there is no second login; your Wonton identity signs in as the admin.
      Importing from a URL needs internet access.
  release_notes: { zh: 第一版。, en: First release. }
  webui:
    service: mealie
    port: 9000
    sso: oidc
    # Mealie 的 OIDC 回转地址是 <网页地址>/login：后端把浏览器送去身份提供方，回来时前端拿 code
    # 调自己的接口换会话。
    oidc:
      redirect_paths: [/login]
  permissions:
    - network.egress
    # 邮箱没配时要提前装不上（compose 里对 WONTON_OWNER_EMAIL 的引用），所以要知道邮箱配没配。
    - owner.identity
  # 上游没写最低内存；本机空闲实测约 68M（2026-11，v3.30.0，单用户空闲），抓取菜谱时有图片处理的尖峰，取 256M。
  # 镜像支持 amd64 和 arm64（ghcr 清单列表）。
  requirements:
    arch: [amd64, arm64]
    memory: 256M
